# ScribeCraft parity checklist vs Express Scribe Pro, from NCH's public product description and
# help pages, never from the installed program's files. Maintained by hand; validated and reported
# by `cargo xtask parity`.
# Status: `shipped` = usable today with at least one cited passing test; `partial` = part exists
# (notes say what is missing); `planned` = not started; `na` = deliberately out of scope (notes say why).
# `tools` lists crates/automation/src/tools.rs names; `evidence` lists path::test_fn.
[schema]
version = 1
statuses = ["planned", "partial", "shipped", "na"]
tiers = ["P0", "P1", "P2", "P3"]
areas = { A = "playback", B = "formats", C = "control", D = "workflow", E = "integration", F = "platform" }

[[feature]]
id = "play.variable-speed"
title = "Variable-speed playback (10 %-400 %)"
area = "A"
tier = "P0"
milestone = "M0"
status = "shipped"
tools = ["transport_set_speed"]
evidence = ["crates/transport/src/tests.rs::render_range_produces_the_slowed_recording", "crates/automation/tests/automation.rs::transcription_workflow_end_to_end"]
notes = "Slider and tool. Not yet: per-dictation remembered speed, speed steps bound to pedal/hotkeys outside the window."

[[feature]]
id = "play.constant-pitch"
title = "Speed changes keep the voice's pitch"
area = "A"
tier = "P0"
milestone = "M0"
status = "shipped"
