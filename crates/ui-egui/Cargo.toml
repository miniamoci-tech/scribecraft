[package]
name = "scribecraft-ui-egui"
description = "ScribeCraft's desktop interface (egui): job list, transport bar, speed and channel controls, notes and bookmarks."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
scribecraft-engine.workspace = true
scribecraft-platform = { workspace = true, features = ["audio", "pedal", "hotkeys"] }
eframe.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Leaving the window without crashing AppKit's Touch Bar finder; see src/quit.rs.
objc2.workspace = true
objc2-app-kit.workspace = true
dispatch2.workspace = true
