name: release

# Builds the installable packages: Windows setup .exe + zip, macOS universal .dmg, Linux tar.gz.
# Run it from the Actions tab ("Run workflow") or by pushing a tag such as v0.1.0.
# Packages are attached to the run as artifacts; for a tag they are also added to a draft release.

on:
  workflow_dispatch:
    inputs:
      macos_runner:
        description: 'Label del runner macOS (usa *-intel se arm64 e in coda)'
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - run: cargo xtask dist
      - uses: actions/upload-artifact@v4
        with:
          name: scribecraft-windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  macos:
    # macos-14 e' dismesso dal 2 novembre 2026.
    # Su un tag non esistono input, quindi il default resta macos-15.
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo xtask dist
      - uses: actions/upload-artifact@v4
        with:
          name: scribecraft-macos
          path: dist/*.dmg

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev libudev-dev pkg-config
      - run: cargo xtask dist
      - uses: actions/upload-artifact@v4
        with:
          name: scribecraft-linux
          path: dist/*.tar.gz

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: packages/*
