name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Un push nuovo sulla stessa PR annulla il run precedente invece di accodarlo:
# e' la causa principale della coda di 12 run in attesa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux + Windows: capacita' abbondante, restano i check obbligatori.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo xtask layers
      - run: cargo xtask assets
      - run: cargo xtask parity
      - run: cargo xtask wasm

  # macOS separato: la capacita' arm64 di GitHub e' satura e i job vengono
  # annullati prima ancora di partire ("job was not acquired by Runner").
  # continue-on-error evita che un annullamento per infrastruttura renda
  # rossa la PR. Togli la riga se preferisci vedere il rosso reale.
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo xtask layers
      - run: cargo xtask assets
      - run: cargo xtask parity
      - run: cargo xtask wasm
